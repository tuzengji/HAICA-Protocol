# V1.4：每个 component 独立启动 DeepSeek Harness + DeepSeek；分组仅负责汇总。
protocol_version = "1.4"

[aggregation]
id = "weighted_sum/v1"
base_score = 0
max_score = 100
round_decimals = 2
on_error = "withhold_total"

[[verifiers]]
id = "text-judge"
kind = "llm"
plugin_api = "llm/v1"
model_profile = "deepseek-text-v1"
required_capabilities = ["text", "structured_output"]
timeout_seconds = 120

[[verifiers]]
id = "visual-judge"
kind = "llm"
plugin_api = "llm/v1"
model_profile = "deepseek-vision-v1"
required_capabilities = ["text", "image", "structured_output"]
timeout_seconds = 120

[[rubrics]]
id = "metric-accuracy"
title = "指标计算准确"
criterion = "本组仅作汇总；各子项的 criterion 独立定义判分要求。"
verifier = "text-judge"
inputs = [{ artifact = "metrics", view = "cells" }]
references = [{ id = "source-data", path = "tests/references/service-usage.csv" }, { id = "facts", path = "tests/references/facts.md" }, { id = "dictionary", path = "tests/references/data-dictionary.md" }]
scale_max = 1
direction = "add"
weight = 40
evidence_required = true

[rubrics.scoring]
id = "weighted_components/v1"
groups = [{ id = "items", weight = 1 }]

[[rubrics.scoring.components]]
id = "available-slots"
group = "items"
criterion = "核对 available_slots 等于给定数据的季度可预约次数合计，数值须准确；该指标须恰好出现一次。"
levels = [{ id = "wrong", score = 0, support_score = 0 }, { id = "correct", score = 1, support_score = 1 }]

[[rubrics.scoring.components]]
id = "booked-slots"
group = "items"
criterion = "核对 booked_slots 等于给定数据的季度已预约次数合计，数值须准确；该指标须恰好出现一次。"
levels = [{ id = "wrong", score = 0, support_score = 0 }, { id = "correct", score = 1, support_score = 1 }]

[[rubrics.scoring.components]]
id = "completion-rate"
group = "items"
criterion = "核对 completion_rate = 季度 completed_visits 合计 / 季度 booked_slots 合计，使用小数，绝对误差不超过 0.000001；该指标须恰好出现一次。"
levels = [{ id = "wrong", score = 0, support_score = 0 }, { id = "correct", score = 1, support_score = 1 }]

[[rubrics.scoring.components]]
id = "booking-rate"
group = "items"
criterion = "核对 booking_rate = 季度 booked_slots 合计 / 季度 available_slots 合计，使用小数，绝对误差不超过 0.000001；该指标须恰好出现一次。"
levels = [{ id = "wrong", score = 0, support_score = 0 }, { id = "correct", score = 1, support_score = 1 }]

[[rubrics.scoring.components]]
id = "completed-visits"
group = "items"
criterion = "核对 completed_visits 等于给定数据的季度完成次数合计，数值须准确；该指标须恰好出现一次。"
levels = [{ id = "wrong", score = 0, support_score = 0 }, { id = "correct", score = 1, support_score = 1 }]

[[rubrics]]
id = "analysis-grounding"
title = "分析与建议有据可依"
criterion = "本组仅作汇总；各子项的 criterion 独立定义判分要求。"
verifier = "text-judge"
inputs = [{ artifact = "report", view = "text" }, { artifact = "metrics", view = "cells" }]
references = [{ id = "facts", path = "tests/references/facts.md" }]
scale_max = 1
direction = "add"
weight = 30
evidence_required = true

[rubrics.scoring]
id = "weighted_components/v1"
groups = [{ id = "items", weight = 1 }]

[[rubrics.scoring.components]]
id = "monthly-trend"
group = "items"
criterion = "核验报告对月度预约、完成情况的分析与私有事实说明一致，至少用一组正确数据支持，不把描述推成确定因果。"
levels = [{ id = "wrong", score = 0, support_score = 0 }, { id = "correct", score = 1, support_score = 1 }]

[[rubrics.scoring.components]]
id = "station-difference"
group = "items"
criterion = "核验报告解释站点差异，至少用一组正确的站点比较支持结论，不臆造人数、成本或满意度。"
levels = [{ id = "wrong", score = 0, support_score = 0 }, { id = "correct", score = 1, support_score = 1 }]

[[rubrics.scoring.components]]
id = "actionable-advice"
group = "items"
criterion = "核验报告至少给出一项由数据支持且明确行动对象的改进建议；材料不能证实的原因须标为待验证假设。"
levels = [{ id = "wrong", score = 0, support_score = 0 }, { id = "correct", score = 1, support_score = 1 }]

[[rubrics]]
id = "source-and-scope"
title = "来源与统计口径清楚"
criterion = "本组仅作汇总；各子项的 criterion 独立定义判分要求。"
verifier = "text-judge"
inputs = [{ artifact = "report", view = "text" }]
references = [{ id = "dictionary", path = "tests/references/data-dictionary.md" }]
scale_max = 1
direction = "add"
weight = 15
evidence_required = true

[rubrics.scoring]
id = "weighted_components/v1"
groups = [{ id = "items", weight = 1 }]

[[rubrics.scoring.components]]
id = "source"
group = "items"
criterion = "明确给定材料文件来源。"
levels = [{ id = "wrong", score = 0, support_score = 0 }, { id = "correct", score = 1, support_score = 1 }]

[[rubrics.scoring.components]]
id = "period"
group = "items"
criterion = "明确统计范围是 2026 年 6—8 月。"
levels = [{ id = "wrong", score = 0, support_score = 0 }, { id = "correct", score = 1, support_score = 1 }]

[[rubrics.scoring.components]]
id = "ratio"
group = "items"
criterion = "说明季度比率使用汇总分子分母计算。"
levels = [{ id = "wrong", score = 0, support_score = 0 }, { id = "correct", score = 1, support_score = 1 }]

[[rubrics.scoring.components]]
id = "count"
group = "items"
criterion = "明确预约次数不等于独立人数。"
levels = [{ id = "wrong", score = 0, support_score = 0 }, { id = "correct", score = 1, support_score = 1 }]

[[rubrics]]
id = "chart-clarity"
title = "图表内容准确且标注完整"
criterion = "本组仅作汇总；各子项的 criterion 独立定义判分要求。"
verifier = "visual-judge"
inputs = [{ artifact = "charts", view = "image" }, { artifact = "report", view = "text" }, { artifact = "metrics", view = "cells" }]
references = [{ id = "facts", path = "tests/references/facts.md" }]
scale_max = 1
direction = "add"
weight = 15
evidence_required = true

[rubrics.scoring]
id = "weighted_components/v1"
groups = [{ id = "items", weight = 1 }]

[[rubrics.scoring.components]]
id = "chart-values"
group = "items"
criterion = "逐一核对槽位内全部图表的数据与私有事实说明、报告及指标表一致，不得只看首图。"
levels = [{ id = "wrong", score = 0, support_score = 0 }, { id = "correct", score = 1, support_score = 1 }]

[[rubrics.scoring.components]]
id = "chart-labels"
group = "items"
criterion = "逐一核对全部图表的标题、月份、站点、指标和单位能明确识别，无关键标注缺失。"
levels = [{ id = "wrong", score = 0, support_score = 0 }, { id = "correct", score = 1, support_score = 1 }]

[[rubrics.scoring.components]]
id = "chart-scales"
group = "items"
criterion = "逐一核对全部图表的坐标尺度和比例没有误导，视觉比较与实际数据关系一致。"
levels = [{ id = "wrong", score = 0, support_score = 0 }, { id = "correct", score = 1, support_score = 1 }]

[[rubrics]]
id = "chart-readability-penalty"
title = "图表阅读障碍"
criterion = "本组仅作汇总；子项独立判断所定义的阅读障碍，原始分越大扣分越多。"
verifier = "visual-judge"
inputs = [{ artifact = "charts", view = "image" }]
scale_max = 1
direction = "deduct"
weight = 20
evidence_required = true

[rubrics.scoring]
id = "weighted_components/v1"
groups = [{ id = "items", weight = 1 }]

[[rubrics.scoring.components]]
id = "chart-readability"
group = "items"
criterion = "检查槽位内全部图表是否存在文字或图形重叠、裁切、文字过小导致无法清楚阅读的障碍。所有图表均无上述障碍时选 correct，原始分为 0；任一图表出现上述障碍时选 wrong，原始分为 1。原始分表示缺陷程度，越大扣分越多；必须定位到受影响的图表。"
levels = [{ id = "correct", score = 0, support_score = 0 }, { id = "wrong", score = 1, support_score = 1 }]
